{% extends 'students/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
    <h1>Delete Student Record</h1>
    <p>Are you sure you want to permanently delete <strong>{{ student.roll_number }} - {{ student.full_name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc2626;">Yes, Delete</button>
        <a href="{% url 'student-home' %}" style="margin-left: 10px;">Cancel</a>
    </form>
{% endblock %}
