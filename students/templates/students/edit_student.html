{% extends 'students/base.html' %}

{% block title %}Edit Student{% endblock %}

{% block content %}
    <h1>Edit Student: {{ student.full_name }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Student</button>
        <a href="{% url 'student-home' %}" style="margin-left: 10px;">Cancel</a>
    </form>
{% endblock %}
